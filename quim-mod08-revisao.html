<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão do Pedro: Funções inorgânicas</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif; background:linear-gradient(160deg,#eeedfb,#d9d6f5); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:#1E2B38;}
  .box{width:100%; max-width:520px; text-align:center;}
  h1{font-size:1.3rem; color:#4338ca; margin-bottom:4px;}
  .sub{color:#64748b; font-size:.9rem; margin-bottom:18px;}
  .contador{font-weight:700; color:#64748b; margin-bottom:12px;}
  .cartao{background:#fff; border-radius:22px; box-shadow:0 12px 34px rgba(67,56,202,.16); padding:36px 28px; min-height:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;}
  .rotulo{font-size:.75rem; letter-spacing:1.5px; text-transform:uppercase; font-weight:800;}
  .rotulo.p{color:#E25E42;} .rotulo.r{color:#4338ca;}
  .pergunta{font-size:1.4rem; font-weight:800; line-height:1.4;}
  .resposta{font-size:1.2rem; line-height:1.5; color:#312e81; display:none; white-space:pre-line;}
  .resposta.mostrar{display:block;}
  .bts{display:flex; gap:10px; margin-top:18px; justify-content:center; flex-wrap:wrap;}
  button{font-family:inherit; font-size:1rem; font-weight:800; border:none; cursor:pointer; padding:14px 22px; border-radius:14px; transition:filter .15s;}
  button:hover{filter:brightness(1.08);}
  .ver{background:#4338ca; color:#fff;} .prox{background:#E25E42; color:#fff;} .voltar{background:#e2e8f0; color:#1E2B38;}
</style>
</head>
<body>
<a href="index.html" class="btn-voltar-hub" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:7px;background:#E25E42;color:#fff;text-decoration:none;font-weight:800;font-size:1rem;padding:11px 18px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:'Segoe UI',system-ui,Arial,sans-serif;">← Voltar</a>
<div class="box">
  <h1>🧪 Funções inorgânicas em cartões</h1>
  <div class="sub">Pergunta e resposta na mesma tela: leia, tente lembrar de cabeça e confira na hora.</div>
  <div class="contador" id="contador"></div>
  <div class="cartao">
    <div><div class="rotulo p">Pergunta</div><div class="pergunta" id="pergunta"></div></div>
    <div class="resposta" id="resposta"></div>
  </div>
  <div class="bts">
    <button class="voltar" id="voltar">← Voltar</button>
    <button class="ver" id="ver">👁️ Ver resposta</button>
    <button class="prox" id="prox">Próximo →</button>
  </div>
</div>
<script>
const cartoes = [
  ["O que é uma função química?", "Um grupo de substâncias com comportamento químico parecido."],
  ["Quais são as quatro funções inorgânicas?", "Ácidos, bases, sais e óxidos."],
  ["Quem definiu ácidos e bases pelo que fazem na água?", "O químico sueco Svante Arrhenius."],
  ["Por que uma solução acende a lâmpada no teste de condutividade?", "Porque tem ÍONS LIVRES, que carregam a corrente elétrica."],
  ["O que é dissociação?", "A água SEPARA íons que já existiam no composto iônico.\nEx.: NaCl → Na⁺ + Cl⁻."],
  ["O que é ionização?", "Os íons NASCEM na reação de uma substância molecular com a água.\nEx.: HCl + H₂O → H₃O⁺ + Cl⁻."],
  ["Ácidos sofrem ionização ou dissociação?", "IONIZAÇÃO. São moleculares e formam íons na água."],
  ["Bases e sais sofrem ionização ou dissociação?", "DISSOCIAÇÃO. Já são iônicos; a água só separa os íons."],
  ["O que é solução eletrolítica?", "A que conduz corrente elétrica, porque tem íons livres. Ex.: água com sal."],
  ["Água com açúcar conduz corrente?", "NÃO. O açúcar não forma íons: é solução não eletrolítica."],
  ["O que é ácido, para Arrhenius?", "A substância que na água libera H⁺ como único cátion."],
  ["O que é o íon hidrônio?", "H₃O⁺. É o H⁺ do ácido grudado numa molécula de água."],
  ["Como reconhecer um ácido pela fórmula?", "Começa com H. Ex.: HCl, H₂SO₄, HNO₃."],
  ["Quais são as características dos ácidos?", "Sabor azedo.\nConduzem corrente na água.\nTornassol vermelho.\npH menor que 7."],
  ["Como se dá nome a um ácido SEM oxigênio?", "Ácido + nome do elemento + ÍDRICO.\nEx.: HCl = ácido clorídrico."],
  ["Como se dá nome a um ácido COM oxigênio?", "Com mais oxigênio: termina em ICO (H₂SO₄, sulfúrico).\nCom um oxigênio a menos: termina em OSO (H₂SO₃, sulfuroso)."],
  ["Onde está o ácido clorídrico (HCl)?", "No suco do estômago. Impuro, é o ácido muriático, de limpeza."],
  ["Onde está o ácido sulfúrico (H₂SO₄)?", "Na bateria de carro. É o ácido mais usado na indústria."],
  ["Onde está o ácido carbônico (H₂CO₃)?", "Nos refrigerantes e na água com gás."],
  ["Qual ácido está no vinagre?", "O ácido acético."],
  ["Qual ácido grava desenhos no vidro?", "O ácido fluorídrico (HF)."],
  ["O que é monoácido, diácido e triácido?", "Libera 1, 2 ou 3 H⁺ na água.\nHCl: monoácido.\nH₂SO₄: diácido.\nH₃PO₄: triácido."],
  ["Cite três ácidos fortes.", "HCl, H₂SO₄ e HNO₃."],
  ["Cite dois ácidos fracos.", "Ácido carbônico (H₂CO₃) e ácido acético (vinagre)."],
  ["O que é base, para Arrhenius?", "A substância que na água libera OH⁻ (hidroxila) como único ânion."],
  ["Como reconhecer uma base pela fórmula?", "Termina com OH. Ex.: NaOH, Ca(OH)₂."],
  ["Quais são as características das bases?", "Sabor adstringente (amarra a boca).\nEscorregadias.\nTornassol azul e fenolftaleína rosa.\npH maior que 7."],
  ["Como se dá nome a uma base?", "Hidróxido de + nome do metal.\nEx.: NaOH = hidróxido de sódio."],
  ["O que é a soda cáustica?", "NaOH, hidróxido de sódio. Usada em sabão e para desentupir pia."],
  ["O que é o leite de magnésia?", "Mg(OH)₂, hidróxido de magnésio. Antiácido e laxante."],
  ["O que é a cal hidratada?", "Ca(OH)₂, hidróxido de cálcio. Usada em pintura e argamassa."],
  ["O que é o amoníaco?", "NH₄OH, hidróxido de amônio. Base fraca, usada em limpeza."],
  ["O que é um indicador ácido-base?", "Uma substância que muda de cor conforme o meio seja ácido ou básico."],
  ["Que cor fica a fenolftaleína no ácido e na base?", "Ácido: INCOLOR.\nBase: ROSA."],
  ["Que cor fica o papel de tornassol no ácido e na base?", "Ácido: VERMELHO.\nBase: AZUL."],
  ["Que cor fica o suco de repolho roxo no ácido e na base?", "Ácido: vermelho ou rosa.\nBase: verde ou amarelo."],
  ["De quanto a quanto vai a escala de pH?", "De 0 a 14."],
  ["O que significa pH menor, igual e maior que 7?", "Menor que 7: ÁCIDO.\nIgual a 7: NEUTRO.\nMaior que 7: BÁSICO."],
  ["pH 2 ou pH 5: qual é mais ácido?", "pH 2. Quanto MENOR o pH, mais ácido."],
  ["pH 9 ou pH 13: qual é mais básico?", "pH 13. Quanto MAIOR o pH, mais básico."],
  ["Qual é o pH da água pura?", "7, neutro."],
  ["Cite coisas ácidas e básicas do dia a dia.", "Ácidas: limão, vinagre, refrigerante, suco gástrico.\nBásicas: sabão, leite de magnésia, bicarbonato, soda cáustica."],
  ["O que é neutralização?", "A reação entre um ácido e uma base.\nÁCIDO + BASE → SAL + ÁGUA."],
  ["O que se forma em HCl + NaOH?", "NaCl + H₂O. Sal de cozinha e água."],
  ["Na neutralização, de onde vem a água?", "Do H⁺ do ácido juntando-se ao OH⁻ da base."],
  ["Por que o leite de magnésia alivia a azia?", "É uma base: neutraliza o excesso de ácido do estômago."],
  ["O que é calagem?", "Jogar calcário ou cal no solo ácido para corrigir a acidez."],
  ["O que é um sal?", "Composto iônico com cátion diferente de H⁺ e ânion diferente de OH⁻. Nasce da neutralização."],
  ["Como o nome do ácido vira o nome do sal?", "ÍDRICO vira ETO.\nICO vira ATO.\nOSO vira ITO."],
  ["O ácido clorídrico dá qual sal com o sódio?", "Cloreto de sódio, NaCl."],
  ["O ácido sulfúrico dá qual sal com o cálcio?", "Sulfato de cálcio, CaSO₄ (o gesso)."],
  ["O que é o bicarbonato de sódio?", "NaHCO₃. Um sal usado como fermento e antiácido."],
  ["O que é o carbonato de cálcio?", "CaCO₃. Calcário, mármore, casca de ovo e giz."],
  ["Qual sal vai na pasta de dente?", "Fluoreto de sódio (NaF), contra a cárie."],
  ["Qual sal é a água sanitária?", "Hipoclorito de sódio (NaClO)."],
  ["O que é um óxido?", "Composto de DOIS elementos, sendo um deles o OXIGÊNIO."],
  ["Como se dá nome a um óxido?", "Óxido de + nome do elemento.\nEx.: CaO = óxido de cálcio."],
  ["O que é óxido ácido?", "Ametal + oxigênio. Com água forma ÁCIDO.\nEx.: CO₂ + H₂O → H₂CO₃."],
  ["O que é óxido básico?", "Metal + oxigênio. Com água forma BASE.\nEx.: CaO + H₂O → Ca(OH)₂."],
  ["Qual a diferença entre CO e CO₂?", "CO: monóxido de carbono, muito tóxico.\nCO₂: dióxido de carbono, gás do efeito estufa."],
  ["O que é a cal virgem?", "CaO, óxido de cálcio. Com água vira cal hidratada."],
  ["Qual óxido é a ferrugem?", "Fe₂O₃, óxido de ferro III."],
  ["A água é um óxido?", "SIM. H₂O tem dois elementos, um deles o oxigênio."],
  ["Como se forma a chuva ácida?", "SO₂ e NO₂ da queima de combustíveis reagem com a água da chuva e formam ácido sulfúrico e ácido nítrico."],
  ["Quais os estragos da chuva ácida?", "Corrói mármore e metais e prejudica plantas, rios e solo."],
  ["Por que o monóxido de carbono é perigoso?", "Gruda na hemoglobina e impede o sangue de levar oxigênio."],
  ["Como reconhecer cada função pela fórmula?", "Começa com H: ácido.\nTermina com OH: base.\nMetal com resto de ácido: sal.\nDois elementos, um é O: óxido."],
  ["H₂O começa com H. É ácido?", "NÃO. É um ÓXIDO: dois elementos, um deles o oxigênio."],
  ["CaCO₃ tem oxigênio. É óxido?", "NÃO. Tem três elementos: é um SAL (carbonato de cálcio)."],
]
let i = 0;
const $ = id => document.getElementById(id);
function mostrar(){
  $("contador").textContent = `Cartão ${i+1} de ${cartoes.length}`;
  $("pergunta").textContent = cartoes[i][0];
  $("resposta").textContent = cartoes[i][1];
  $("resposta").className = "resposta mostrar";   // resposta sempre visivel
  $("ver").style.display = "none";
  $("voltar").disabled = (i === 0); $("voltar").style.opacity = (i === 0) ? .4 : 1;
  $("prox").textContent = (i === cartoes.length-1) ? "🔁 Recomeçar" : "Próximo →";
}
$("ver").onclick = ()=>{ $("resposta").className = "resposta mostrar"; $("ver").style.display = "none"; };
$("prox").onclick = ()=>{ i = (i+1) % cartoes.length; mostrar(); };
$("voltar").onclick = ()=>{ if(i > 0){ i--; mostrar(); } };
mostrar();
</script>
</body>
</html>
