  .alt.errado{border-color:var(--no); background:var(--no-cl);} .alt.errado .letra{background:var(--no);}

  .final .nota{font-size:3rem; font-weight:900; color:var(--q); margin:6px 0;}
  .final .recado{background:var(--laranja); border-radius:14px; padding:14px 18px; margin:18px 0; color:var(--navy);}
  .refazer{padding:14px 28px; font-size:1.05rem; font-weight:800; background:var(--q); color:#fff; border:none; border-radius:14px; cursor:pointer; font-family:inherit;}
</style>

  { q:"Qual ácido está no refrigerante e na água com gás?", alt:["Ácido carbônico (H₂CO₃)","Ácido clorídrico","Ácido nítrico"], c:0,

  { q:"Qual ácido está no vinagre?", alt:["Ácido acético","Ácido sulfúrico","Ácido fluorídrico"], c:0,

  { q:"O H₂SO₄ libera quantos H⁺ na água?", alt:["2 (diácido)","1 (monoácido)","4"], c:0,

  { q:"Qual destes é um ácido FORTE?", alt:["HCl","H₂CO₃","ácido acético"], c:0,

  // bases
  { q:"Para Arrhenius, base é a substância que na água libera...", alt:["OH⁻ como único ânion","H⁺ como único cátion","O²⁻ como único ânion"], c:0,

  { q:"Como reconhecer uma base pela fórmula?", alt:["Termina com OH","Começa com H","Não tem metal"], c:0,

  { q:"As bases têm pH...", alt:["maior que 7","menor que 7","igual a 7"], c:0,

  { q:"O amoníaco (NH₄OH), usado em limpeza, é...", alt:["uma base fraca","um ácido forte","um óxido"], c:0,

  { q:"Num ÁCIDO, a fenolftaleína fica...", alt:["incolor","rosa","vermelha"], c:0,

  { q:"Num ÁCIDO, o papel de tornassol fica...", alt:["vermelho","azul","verde"], c:0,

  { q:"Numa BASE, o papel de tornassol fica...", alt:["azul","vermelho","incolor"], c:0,

  { q:"Numa base, o suco de repolho roxo fica...", alt:["verde ou amarelo","vermelho","roxo"], c:0,

  { q:"A escala de pH vai de...", alt:["0 a 14","1 a 10","0 a 100"], c:0,

  { q:"Uma solução de pH 7 é...", alt:["neutra","ácida","básica"], c:0,

  { q:"Uma solução de pH 3 é...", alt:["ácida","básica","neutra"], c:0,

  { q:"Uma solução de pH 11 é...", alt:["básica","ácida","neutra"], c:0,

  { q:"Qual é MAIS ácido?", alt:["pH 2","pH 5","pH 6"], c:0,
    e:"Quanto menor o pH, mais ácido." },
  { q:"Qual é MAIS básico?", alt:["pH 13","pH 9","pH 8"], c:0,
    e:"Quanto maior o pH, mais básico." },
  { q:"Qual destes tem pH menor que 7?", alt:["suco de limão","sabão","leite de magnésia"], c:0,
    e:"Limão é ácido. Sabão e leite de magnésia são básicos." },
  { q:"Qual destes tem pH maior que 7?", alt:["bicarbonato de sódio dissolvido","vinagre","refrigerante"], c:0,
    e:"O bicarbonato deixa a água levemente básica." },
  // neutralizacao
  { q:"A reação entre um ácido e uma base forma...", alt:["sal e água","óxido e hidrogênio","só água"], c:0,
    e:"É a neutralização: ÁCIDO + BASE → SAL + ÁGUA." },
  { q:"HCl + NaOH forma...", alt:["NaCl + H₂O","NaOH + HCl","Na₂O + Cl₂"], c:0,
    e:"Sal de cozinha e água." },
  { q:"Na neutralização, a água vem da união de...", alt:["H⁺ do ácido com OH⁻ da base","Na⁺ com Cl⁻","dois oxigênios"], c:0,
    e:"H⁺ + OH⁻ → H₂O. O que sobra forma o sal." },
  { q:"Por que o leite de magnésia alivia a azia?", alt:["É uma base que neutraliza o ácido do estômago","É um ácido que dissolve a comida","Porque é gelado"], c:0,
    e:"A azia vem do excesso de ácido clorídrico no estômago." },
  { q:"A calagem, feita pelo agricultor, serve para...", alt:["corrigir a acidez do solo com calcário ou cal","deixar o solo mais ácido","regar a plantação"], c:0,
    e:"Solo muito ácido prejudica a plantação." },
  // sais
  { q:"Um sal se forma na reação entre...", alt:["um ácido e uma base","dois metais","um óxido e o ar"], c:0,
    e:"É o produto da neutralização, junto com a água." },
  { q:"Na passagem do nome do ácido para o sal, -ÍDRICO vira...", alt:["-ETO","-ATO","-ITO"], c:0,
    e:"Ácido clorídrico → cloreto de sódio." },
  { q:"Na passagem do nome do ácido para o sal, -ICO vira...", alt:["-ATO","-ETO","-ITO"], c:0,

  { q:"Na passagem do nome do ácido para o sal, -OSO vira...", alt:["-ITO","-ATO","-ETO"], c:0,

  { q:"O nome do NaCl é...", alt:["cloreto de sódio","clorato de sódio","hidróxido de sódio"], c:0,

  { q:"O bicarbonato de sódio (NaHCO₃) é usado como...", alt:["fermento e antiácido","combustível","tinta"], c:0,

  { q:"O sal que vai na pasta de dente contra a cárie é o...", alt:["fluoreto de sódio (NaF)","cloreto de sódio","sulfato de cálcio"], c:0,

  { q:"A água sanitária é o sal...", alt:["hipoclorito de sódio (NaClO)","bicarbonato de sódio","nitrato de potássio"], c:0,

function embaralhar(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function preparar(){ return embaralhar(questoes.slice()).map(q=>{ const alts=q.alt.map((t,i)=>({t,c:i===q.c})); embaralhar(alts); return {q:q.q, alt:alts.map(a=>a.t), c:alts.findIndex(a=>a.c), e:q.e}; }); }
let jogo = preparar(); let atual=0, acertos=0; const letras=["A","B","C"]; const $=id=>document.getElementById(id);
function render(){ const it=jogo[atual]; $("contador").textContent=`Questão ${atual+1} de ${jogo.length}`; $("placar").textContent=`Acertos: ${acertos}`; $("barra").style.width=`${(atual/jogo.length)*100}%`; $("pergunta").textContent=it.q; const b=$("alternativas"); b.innerHTML=""; it.alt.forEach((t,i)=>{ const x=document.createElement("button"); x.className="alt"; x.innerHTML=`<span class="letra">${letras[i]}</span><span>${t}</span>`; x.onclick=()=>responder(i); b.appendChild(x); }); const f=$("feedback"); f.className="feedback"; f.innerHTML=""; $("proxima").className="proxima"; $("proxima").textContent=atual===jogo.length-1?"Ver resultado 🏁":"Próxima ➜"; }
function responder(e){ const it=jogo[atual]; document.querySelectorAll(".alt").forEach((b,i)=>{ b.disabled=true; if(i===it.c)b.classList.add("certo"); if(i===e&&e!==it.c)b.classList.add("errado"); }); const f=$("feedback"); if(e===it.c){acertos++; f.className="feedback ok mostrar"; f.innerHTML=`<b>✅ Acertou!</b>${it.e}`;} else {f.className="feedback no mostrar"; f.innerHTML=`<b>❌ Quase!</b> A resposta certa é <b>${letras[it.c]}</b>. ${it.e}`;} $("placar").textContent=`Acertos: ${acertos}`; $("proxima").classList.add("mostrar"); }
$("proxima").onclick=()=>{ atual++; if(atual<jogo.length)render(); else final(); };
function final(){ const t=jogo.length; const nota=Math.round((acertos/t)*100)/10; const p=acertos/t; let e,m; if(p>=0.9){e="🏆";m="Fera! Mandou muito bem. Pronto para a prova!";} else if(p>=0.7){e="😃";m="Muito bom! Só falta revisar alguns pontinhos.";} else if(p>=0.45){e="🙂";m="Bom começo! Dá uma relida no resumo e refaça.";} else {e="💪";m="Sem problema! Leia o resumo com calma e tente de novo.";} $("barra").style.width="100%"; $("contador").textContent="Fim do quiz"; $("palco").innerHTML=`<div class="final"><div class="emoji">${e}</div><h2>Quiz concluído!</h2><div class="placar">Você acertou <b>${acertos}</b> de <b>${t}</b></div><div class="nota">Nota ${nota}</div><div class="recado">${m}</div><button class="refazer" onclick="reiniciar()">🔀 Embaralhar e refazer</button></div>`; }
function reiniciar(){ atual=0; acertos=0; jogo=preparar(); $("palco").innerHTML=`<div class="pergunta" id="pergunta"></div><div class="alternativas" id="alternativas"></div><div class="feedback" id="feedback"></div><button class="proxima" id="proxima">Próxima ➜</button>`; $("proxima").onclick=()=>{ atual++; if(atual<jogo.length)render(); else final(); }; render(); }
render();
</script>
</body>
</html>
