<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão do Pedro: Física, prova do 4º bimestre</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif; background:linear-gradient(160deg,#fdf5ea,#f6dfc2); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:#1E2B38;}
  .box{width:100%; max-width:520px; text-align:center;}
  h1{font-size:1.3rem; color:#b45309; margin-bottom:4px;}
  .sub{color:#64748b; font-size:.9rem; margin-bottom:18px;}
  .contador{font-weight:700; color:#64748b; margin-bottom:12px;}
  .cartao{background:#fff; border-radius:22px; box-shadow:0 12px 34px rgba(180,83,9,.16); padding:36px 28px; min-height:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;}
  .rotulo{font-size:.75rem; letter-spacing:1.5px; text-transform:uppercase; font-weight:800;}
  .rotulo.p{color:#E25E42;} .rotulo.r{color:#b45309;}
  .pergunta{font-size:1.4rem; font-weight:800; line-height:1.4;}
  .resposta{font-size:1.2rem; line-height:1.5; color:#7c2d12; display:none; white-space:pre-line;}
  .resposta.mostrar{display:block;}
  .bts{display:flex; gap:10px; margin-top:18px; justify-content:center; flex-wrap:wrap;}
  button{font-family:inherit; font-size:1rem; font-weight:800; border:none; cursor:pointer; padding:14px 22px; border-radius:14px; transition:filter .15s;}
  button:hover{filter:brightness(1.08);}
  .ver{background:#b45309; color:#fff;} .prox{background:#E25E42; color:#fff;} .voltar{background:#e2e8f0; color:#1E2B38;}
</style>
</head>
<body>
<a href="index.html" class="btn-voltar-hub" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:7px;background:#E25E42;color:#fff;text-decoration:none;font-weight:800;font-size:1rem;padding:11px 18px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:'Segoe UI',system-ui,Arial,sans-serif;">← Voltar</a>
<div class="box">
  <h1>🪐 Física: o básico em cartões</h1>
  <div class="sub">Pergunta e resposta na mesma tela: leia, tente lembrar de cabeça e confira na hora.</div>
  <div class="contador" id="contador"></div>
  <div class="cartao">
    <div><div class="rotulo p">Pergunta</div><div class="pergunta" id="pergunta"></div></div>
    <div class="resposta" id="resposta"></div>
  </div>
  <div class="bts">
    <button class="voltar" id="voltar">← Voltar</button>
    <button class="ver" id="ver">👁️ Ver resposta</button>
    <button class="prox" id="prox">Próximo →</button>
  </div>
</div>
<script>
const cartoes = [
  ["Quantos planetas tem o Sistema Solar?", "Oito."],
  ["Qual planeta vem depois da Terra?", "Marte."],
  ["Qual planeta fica mais perto do Sol?", "Mercúrio."],
  ["Qual planeta fica mais longe do Sol?", "Netuno."],
  ["Em que planeta nós vivemos?", "Na Terra, o terceiro a partir do Sol."],
  ["O Sol é planeta ou estrela?", "ESTRELA. Tem luz própria."],
  ["A Lua é o quê?", "O satélite natural da Terra. Ela reflete a luz do Sol."],
  ["Quem gira em torno de quem?", "A Terra gira em torno do Sol. A Lua gira em torno da Terra."],
  ["Para que serviam os calendários?", "Para marcar o tempo, plantar e se organizar."],
  ["Terra no centro ou Sol no centro: qual é o certo?", "Sol no centro: heliocentrismo."],
  ["Qual é a ordem dos planetas?", "Mercúrio, Vênus, Terra, Marte, Júpiter, Saturno, Urano e Netuno."],
  ["Qual é o maior planeta?", "Júpiter."],
  ["Qual é o menor planeta?", "Mercúrio."],
  ["Qual é o planeta vermelho?", "Marte."],
  ["Qual planeta é famoso pelos anéis?", "Saturno."],
  ["Como se chama a nossa galáxia?", "Via Láctea."],
  ["O que é ano-luz?", "Medida de DISTÂNCIA: o que a luz percorre em 1 ano."],
  ["O que é geocentrismo?", "Terra no centro do Universo. Defendido por Ptolomeu."],
  ["O que é heliocentrismo?", "Sol no centro. Defendido por Copérnico."],
  ["O que Kepler descobriu?", "Que as órbitas dos planetas são elipses."],
  ["O que Galileu fez?", "Observou o céu com a luneta."],
  ["O que diz a lei de Newton?", "Gravitação universal: matéria atrai matéria."],
  ["Qual a diferença entre astro luminoso e iluminado?", "Luminoso: tem luz própria (estrela).\nIluminado: reflete luz (planeta)."],
  ["O que indicam o Cruzeiro do Sul e a Estrela Polar?", "Cruzeiro do Sul: o sul.\nEstrela Polar: o norte."],
  ["De onde vem a energia do Sol?", "Da fusão nuclear: hidrogênio vira hélio."],
  ["Planetas rochosos e gasosos?", "Rochosos: Mercúrio, Vênus, Terra e Marte.\nGasosos: Júpiter, Saturno, Urano e Netuno."],
  ["Qual é o planeta mais quente?", "Vênus, por causa do efeito estufa."],
  ["Onde fica o Cinturão de Asteroides?", "Entre Marte e Júpiter."],
  ["Meteoroide, meteoro e meteorito?", "Meteoroide: no espaço.\nMeteoro: o rastro de luz.\nMeteorito: o que chega ao chão."],
  ["O que foi o Big Bang?", "O início do Universo, quente e denso, que continua se expandindo. Não foi explosão."],
  ["O que é nebulosa?", "Nuvem de gás e poeira onde nascem as estrelas."],
  ["Como termina uma estrela grande?", "Em supernova, e depois estrela de nêutrons ou buraco negro."],
  ["Como vai terminar o Sol?", "Gigante vermelha e depois anã branca."],
  ["Quem foi o primeiro humano no espaço? E na Lua?", "Espaço: Gagarin, em 1961.\nLua: Armstrong, em 1969."],
  ["Existe gravidade na ISS?", "SIM. A falta de peso é uma sensação, por causa da queda livre."],
  ["O que é exoplaneta? E zona habitável?", "Exoplaneta: planeta fora do Sistema Solar.\nZona habitável: onde pode existir água líquida."],
]
let i = 0;
const $ = id => document.getElementById(id);
function mostrar(){
  $("contador").textContent = `Cartão ${i+1} de ${cartoes.length}`;
  $("pergunta").textContent = cartoes[i][0];
  $("resposta").textContent = cartoes[i][1];
  $("resposta").className = "resposta mostrar";   // resposta sempre visivel
  $("ver").style.display = "none";
  $("voltar").disabled = (i === 0); $("voltar").style.opacity = (i === 0) ? .4 : 1;
  $("prox").textContent = (i === cartoes.length-1) ? "🔁 Recomeçar" : "Próximo →";
}
$("ver").onclick = ()=>{ $("resposta").className = "resposta mostrar"; $("ver").style.display = "none"; };
$("prox").onclick = ()=>{ i = (i+1) % cartoes.length; mostrar(); };
$("voltar").onclick = ()=>{ if(i > 0){ i--; mostrar(); } };
mostrar();
</script>
</body>
</html>
