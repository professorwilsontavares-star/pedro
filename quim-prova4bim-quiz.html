<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz do Pedro: Química, prova do 4º bimestre</title>
<style>
  :root{--navy:#1E2B38; --q:#4338ca; --q-cl:#e8e7fb; --laranja:#FFE4CC; --coral:#E25E42; --ok:#2e7d4f; --ok-cl:#d7f0df; --no:#c0392b; --no-cl:#fbe0dc; --cinza:#64748b;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif; background:linear-gradient(160deg,#eeedfb,#d9d6f5); color:var(--navy); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; line-height:1.55;}
  .app{width:100%; max-width:640px; background:#fff; border-radius:24px; box-shadow:0 12px 40px rgba(67,56,202,.16); overflow:hidden;}
  header{background:linear-gradient(135deg,#4338ca,#312e81); color:#fff; padding:22px 26px 18px;}
  header .selo{font-size:.72rem; letter-spacing:1.5px; text-transform:uppercase; opacity:.8; font-weight:700;}
  header h1{font-size:1.35rem; margin-top:4px;}
  .barra-topo{display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:.9rem; font-weight:700;}
  .progresso{height:9px; background:rgba(255,255,255,.25); border-radius:20px; margin-top:10px; overflow:hidden;}
  .progresso span{display:block; height:100%; width:0; background:var(--coral); border-radius:20px; transition:width .35s ease;}
  main{padding:26px 26px 30px;}
  .pergunta{font-size:1.25rem; font-weight:800; color:var(--navy); margin-bottom:20px; min-height:60px;}
  .alternativas{display:flex; flex-direction:column; gap:12px;}
  .alt{text-align:left; font-size:1.05rem; padding:15px 18px; border:2px solid #d9d6f5; background:#f7f6fe; border-radius:14px; cursor:pointer; transition:all .15s ease; display:flex; align-items:center; gap:12px; font-family:inherit; color:var(--navy);}
  .alt:hover:not(:disabled){border-color:var(--q); background:var(--q-cl); transform:translateY(-1px);}
  .alt:disabled{cursor:default;}
  .alt .letra{flex:0 0 30px; height:30px; border-radius:50%; background:var(--q); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.95rem;}
  .alt.certo{border-color:var(--ok); background:var(--ok-cl);} .alt.certo .letra{background:var(--ok);}
  .alt.errado{border-color:var(--no); background:var(--no-cl);} .alt.errado .letra{background:var(--no);}
  .feedback{margin-top:20px; padding:15px 18px; border-radius:14px; display:none; font-size:1rem;}
  .feedback.mostrar{display:block;}
  .feedback.ok{background:var(--ok-cl);}
  .feedback.no{background:var(--no-cl);}
  .feedback b:first-child{display:block; margin-bottom:3px;}
  .proxima{margin-top:20px; width:100%; padding:15px; font-size:1.1rem; font-weight:800; background:var(--coral); color:#fff; border:none; border-radius:14px; cursor:pointer; font-family:inherit; display:none;}
  .proxima.mostrar{display:block;} .proxima:hover{filter:brightness(1.08);}
  .final{text-align:center; padding:14px 6px;}
  .final .emoji{font-size:3.4rem;} .final h2{font-size:1.6rem; margin:10px 0;}
  .final .placar{font-size:1.15rem; color:var(--cinza); margin-bottom:6px;}
  .final .nota{font-size:3rem; font-weight:900; color:var(--q); margin:6px 0;}
  .final .recado{background:var(--laranja); border-radius:14px; padding:14px 18px; margin:18px 0; color:var(--navy);}
  .refazer{padding:14px 28px; font-size:1.05rem; font-weight:800; background:var(--q); color:#fff; border:none; border-radius:14px; cursor:pointer; font-family:inherit;}
</style>
</head>
<body>
<a href="index.html" class="btn-voltar-hub" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:7px;background:#E25E42;color:#fff;text-decoration:none;font-weight:800;font-size:1rem;padding:11px 18px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:'Segoe UI',system-ui,Arial,sans-serif;">← Voltar</a>
<div class="app">
  <header>
    <div class="selo">Química · Prova do 4º bimestre · Quiz</div>
    <h1>Química: o básico 🧪</h1>
    <div class="barra-topo"><span id="contador">Questão 1</span><span id="placar">Acertos: 0</span></div>
    <div class="progresso"><span id="barra"></span></div>
  </header>
  <main id="palco">
    <div class="pergunta" id="pergunta"></div>
    <div class="alternativas" id="alternativas"></div>
    <div class="feedback" id="feedback"></div>
    <button class="proxima" id="proxima">Próxima ➜</button>
  </main>
</div>
<script>
const questoes = [
  // faceis
  { q:"Qual destas substâncias é um óxido?", alt:["CO₂","NaCl","HCl"], c:0,
    e:"Dois elementos, sendo um o oxigênio." },
  { q:"Óxido ácido + água forma...", alt:["ácido","base","sal"], c:0,
    e:"CO₂ + H₂O → H₂CO₃." },
  { q:"Óxido básico + água forma...", alt:["base","ácido","gás"], c:0,
    e:"CaO + H₂O → Ca(OH)₂." },
  { q:"O excesso de CO₂ agrava...", alt:["o efeito estufa","a chuva de granizo","a ferrugem"], c:0,
    e:"Mais calor fica preso na atmosfera." },
  { q:"Separar o lixo é uma atitude...", alt:["sustentável","predatória","ilegal"], c:0,
    e:"Assim como economizar água e energia." },
  { q:"Um Parque Nacional é um tipo de...", alt:["Unidade de Conservação","Terra Indígena","cidade"], c:0,
    e:"O primeiro foi Itatiaia, em 1937." },
  { q:"Greenwashing é...", alt:["fingir que é sustentável","lavar as plantas","um tipo de reciclagem"], c:0,
    e:"Também chamado de mentira verde." },
  // oxidos
  { q:"Quais óxidos causam a chuva ácida?", alt:["SO₂, SO₃ e NO₂","CaO e MgO","H₂O e O₂"], c:0,
    e:"Com a água da chuva formam ácidos." },
  { q:"Qual óxido é muito tóxico e mata por asfixia?", alt:["CO","CO₂","CaO"], c:0,
    e:"Monóxido de carbono." },
  { q:"O nome do CO₂ é...", alt:["dióxido de carbono","monóxido de carbono","óxido de cálcio"], c:0,
    e:"Di = 2 oxigênios." },
  { q:"O nome do CaO é...", alt:["óxido de cálcio","dióxido de cálcio","carbonato de cálcio"], c:0,
    e:"Óxido de metal não usa prefixo." },
  // sustentabilidade
  { q:"Desenvolvimento sustentável é...", alt:["usar hoje sem prejudicar as próximas gerações","gastar tudo agora","parar de produzir"], c:0,
    e:"Envolve o social, o ambiental e o econômico." },
  { q:"O tripé da sustentabilidade é...", alt:["social, ambiental e econômico","água, ar e terra","rico, médio e pobre"], c:0,
    e:"Os três precisam andar juntos." },
  { q:"A Agenda 2030 da ONU tem...", alt:["17 objetivos","2 objetivos","100 objetivos"], c:0,
    e:"Objetivos de desenvolvimento sustentável." },
  { q:"A Química Verde busca...", alt:["evitar substâncias tóxicas e resíduos","pintar as fábricas","usar mais petróleo"], c:0,
    e:"Melhor evitar o resíduo do que tratar depois." },
  { q:"Garimpo predatório é sustentável?", alt:["Não, destrói a floresta e contamina a água","Sim, sempre","Sim, se der lucro"], c:0,
    e:"Libera metais pesados no ambiente." },
  // unidades
  { q:"A água que bebemos é um serviço de...", alt:["provisão","suporte","cultura"], c:0,
    e:"Provisão é o produto obtido direto." },
  { q:"O controle do clima é um serviço de...", alt:["regulação","provisão","lazer"], c:0,
    e:"A polinização também é regulação." },
  { q:"O solo fértil é um serviço de...", alt:["suporte","provisão","cultura"], c:0,
    e:"Suporte mantém todos os outros." },
  { q:"O ecoturismo é um serviço...", alt:["cultural","de suporte","de provisão"], c:0,
    e:"Benefício não material." },
  { q:"Numa UC de Proteção Integral...", alt:["só se permite uso indireto","pode construir fábrica","pode caçar à vontade"], c:0,
    e:"Exemplo: Parque Nacional." },
  { q:"A zona de amortecimento fica...", alt:["em volta da UC","no centro da cidade","no fundo do mar"], c:0,
    e:"Segura os impactos antes de chegarem à UC." },
  { q:"As Terras Indígenas pertencem...", alt:["à União","aos fazendeiros","às prefeituras"], c:0,
    e:"Os indígenas têm a posse e o uso exclusivo." },
]
function embaralhar(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function preparar(){ return embaralhar(questoes.slice()).map(q=>{ const alts=q.alt.map((t,i)=>({t,c:i===q.c})); embaralhar(alts); return {q:q.q, alt:alts.map(a=>a.t), c:alts.findIndex(a=>a.c), e:q.e}; }); }
let jogo = preparar(); let atual=0, acertos=0; const letras=["A","B","C"]; const $=id=>document.getElementById(id);
function render(){ const it=jogo[atual]; $("contador").textContent=`Questão ${atual+1} de ${jogo.length}`; $("placar").textContent=`Acertos: ${acertos}`; $("barra").style.width=`${(atual/jogo.length)*100}%`; $("pergunta").textContent=it.q; const b=$("alternativas"); b.innerHTML=""; it.alt.forEach((t,i)=>{ const x=document.createElement("button"); x.className="alt"; x.innerHTML=`<span class="letra">${letras[i]}</span><span>${t}</span>`; x.onclick=()=>responder(i); b.appendChild(x); }); const f=$("feedback"); f.className="feedback"; f.innerHTML=""; $("proxima").className="proxima"; $("proxima").textContent=atual===jogo.length-1?"Ver resultado 🏁":"Próxima ➜"; }
function responder(e){ const it=jogo[atual]; document.querySelectorAll(".alt").forEach((b,i)=>{ b.disabled=true; if(i===it.c)b.classList.add("certo"); if(i===e&&e!==it.c)b.classList.add("errado"); }); const f=$("feedback"); if(e===it.c){acertos++; f.className="feedback ok mostrar"; f.innerHTML=`<b>✅ Acertou!</b>${it.e}`;} else {f.className="feedback no mostrar"; f.innerHTML=`<b>❌ Quase!</b> A resposta certa é <b>${letras[it.c]}</b>. ${it.e}`;} $("placar").textContent=`Acertos: ${acertos}`; $("proxima").classList.add("mostrar"); }
$("proxima").onclick=()=>{ atual++; if(atual<jogo.length)render(); else final(); };
function final(){ const t=jogo.length; const nota=Math.round((acertos/t)*100)/10; const p=acertos/t; let e,m; if(p>=0.9){e="🏆";m="Fera! Mandou muito bem. Pronto para a prova!";} else if(p>=0.7){e="😃";m="Muito bom! Só falta revisar alguns pontinhos.";} else if(p>=0.45){e="🙂";m="Bom começo! Dá uma relida no resumo e refaça.";} else {e="💪";m="Sem problema! Leia o resumo com calma e tente de novo.";} $("barra").style.width="100%"; $("contador").textContent="Fim do quiz"; $("palco").innerHTML=`<div class="final"><div class="emoji">${e}</div><h2>Quiz concluído!</h2><div class="placar">Você acertou <b>${acertos}</b> de <b>${t}</b></div><div class="nota">Nota ${nota}</div><div class="recado">${m}</div><button class="refazer" onclick="reiniciar()">🔀 Embaralhar e refazer</button></div>`; }
function reiniciar(){ atual=0; acertos=0; jogo=preparar(); $("palco").innerHTML=`<div class="pergunta" id="pergunta"></div><div class="alternativas" id="alternativas"></div><div class="feedback" id="feedback"></div><button class="proxima" id="proxima">Próxima ➜</button>`; $("proxima").onclick=()=>{ atual++; if(atual<jogo.length)render(); else final(); }; render(); }
render();
</script>
</body>
</html>
