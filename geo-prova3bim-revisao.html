<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão do Pedro: Geografia, prova do 3º bimestre</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif; background:linear-gradient(160deg,#f1f7ea,#dcebc9); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:#1E2B38;}
  .box{width:100%; max-width:520px; text-align:center;}
  h1{font-size:1.3rem; color:#4d7c0f; margin-bottom:4px;}
  .sub{color:#64748b; font-size:.9rem; margin-bottom:18px;}
  .contador{font-weight:700; color:#64748b; margin-bottom:12px;}
  .cartao{background:#fff; border-radius:22px; box-shadow:0 12px 34px rgba(77,124,15,.16); padding:36px 28px; min-height:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;}
  .rotulo{font-size:.75rem; letter-spacing:1.5px; text-transform:uppercase; font-weight:800;}
  .rotulo.p{color:#E25E42;} .rotulo.r{color:#4d7c0f;}
  .pergunta{font-size:1.4rem; font-weight:800; line-height:1.4;}
  .resposta{font-size:1.2rem; line-height:1.5; color:#365314; display:none; white-space:pre-line;}
  .resposta.mostrar{display:block;}
  .bts{display:flex; gap:10px; margin-top:18px; justify-content:center; flex-wrap:wrap;}
  button{font-family:inherit; font-size:1rem; font-weight:800; border:none; cursor:pointer; padding:14px 22px; border-radius:14px; transition:filter .15s;}
  button:hover{filter:brightness(1.08);}
  .ver{background:#4d7c0f; color:#fff;} .prox{background:#E25E42; color:#fff;} .voltar{background:#e2e8f0; color:#1E2B38;}
</style>
</head>
<body>
<a href="index.html" class="btn-voltar-hub" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:7px;background:#E25E42;color:#fff;text-decoration:none;font-weight:800;font-size:1rem;padding:11px 18px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:'Segoe UI',system-ui,Arial,sans-serif;">← Voltar</a>
<div class="box">
  <h1>🌏 Geografia: o básico em cartões</h1>
  <div class="sub">Pergunta e resposta na mesma tela: leia, tente lembrar de cabeça e confira na hora.</div>
  <div class="contador" id="contador"></div>
  <div class="cartao">
    <div><div class="rotulo p">Pergunta</div><div class="pergunta" id="pergunta"></div></div>
    <div class="resposta" id="resposta"></div>
  </div>
  <div class="bts">
    <button class="voltar" id="voltar">← Voltar</button>
    <button class="ver" id="ver">👁️ Ver resposta</button>
    <button class="prox" id="prox">Próximo →</button>
  </div>
</div>
<script>
const cartoes = [
  ["Quando nasceu e quando acabou a URSS?", "Nasceu em 1917 e acabou em 1991."],
  ["Quem disputou a Guerra Fria?", "EUA × URSS."],
  ["Quais são os 5 membros permanentes do Conselho de Segurança da ONU?", "EUA, Rússia, China, França e Reino Unido.\nTodos com poder de VETO."],
  ["Quais países formam o Brics?", "Brasil, Rússia, Índia, China e África do Sul."],
  ["O que aconteceu com a Crimeia em 2014?", "Foi ANEXADA pela Rússia."],
  ["O que aconteceu com a Ucrânia em 2022?", "Foi INVADIDA pela Rússia."],
  ["Qual é a capital da China?", "Pequim."],
  ["Qual é a montanha mais alta do mundo?", "O Everest (8.848 m), no Himalaia."],
  ["Qual é a maior hidrelétrica do mundo?", "Três Gargantas, no rio Azul (China)."],
  ["Qual é a principal parceira comercial do Brasil?", "A CHINA, desde 2010."],
  ["Qual é a capital da Rússia?", "Moscou."],
  ["Quem é o presidente da Rússia? E o da China?", "Rússia: Putin.\nChina: Xi Jinping."],
  ["O que é o Himalaia?", "A cordilheira mais alta do mundo. Nela fica o Everest."],
  ["Qual é o maior rio da China?", "O Rio Azul (Yang-tsé)."],
  ["Quem foi Deng Xiaoping?", "O líder que abriu a economia chinesa (socialismo de mercado)."],
  ["Qual país tem o maior arsenal nuclear?", "A RÚSSIA (5.580 ogivas), seguida dos EUA."],
  ["O que é fuga de cérebros?", "Cientistas que vão embora para outros países atrás de salário e reconhecimento. Aconteceu na Rússia depois do fim da URSS."],
  ["Por que a Rússia invadiu a Ucrânia?", "Alegou impedir a Ucrânia de entrar na OTAN, aliança militar liderada pelos EUA."],
  ["Como é o relevo da China?", "Oeste ALTO (Himalaia).\nLeste BAIXO (planícies), onde vive a maior parte do povo."],
  ["O que aconteceu na China em 1949?", "Mao Tsé-Tung e os comunistas criaram a República Popular da China."],
  ["O que é socialismo de mercado?", "Economia capitalista com um partido único, o Partido Comunista."],
  ["O que são as ZEEs?", "Zonas Econômicas Especiais: cidades do litoral com imposto baixo que atraem empresas estrangeiras."],
  ["Por que a China é a fábrica do mundo?", "Faz quase 30% da produção industrial do planeta. É a maior produtora de aço."],
  ["O que o Brasil vende para a China?", "Soja, minério de ferro e petróleo."],
  ["Qual país mais emite CO₂ e por quê?", "A CHINA, por causa do carvão."],
]
let i = 0;
const $ = id => document.getElementById(id);
function mostrar(){
  $("contador").textContent = `Cartão ${i+1} de ${cartoes.length}`;
  $("pergunta").textContent = cartoes[i][0];
  $("resposta").textContent = cartoes[i][1];
  $("resposta").className = "resposta mostrar";   // resposta sempre visivel
  $("ver").style.display = "none";
  $("voltar").disabled = (i === 0); $("voltar").style.opacity = (i === 0) ? .4 : 1;
  $("prox").textContent = (i === cartoes.length-1) ? "🔁 Recomeçar" : "Próximo →";
}
$("ver").onclick = ()=>{ $("resposta").className = "resposta mostrar"; $("ver").style.display = "none"; };
$("prox").onclick = ()=>{ i = (i+1) % cartoes.length; mostrar(); };
$("voltar").onclick = ()=>{ if(i > 0){ i--; mostrar(); } };
mostrar();
</script>
</body>
</html>
