<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão do Pedro: Simulado de Biologia e Química</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif; background:linear-gradient(160deg,#eeedfb,#d9d6f5); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:#1E2B38;}
  .box{width:100%; max-width:520px; text-align:center;}
  h1{font-size:1.3rem; color:#0f766e; margin-bottom:4px;}
  .sub{color:#64748b; font-size:.9rem; margin-bottom:18px;}
  .contador{font-weight:700; color:#64748b; margin-bottom:12px;}
  .cartao{background:#fff; border-radius:22px; box-shadow:0 12px 34px rgba(67,56,202,.16); padding:36px 28px; min-height:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;}
  .rotulo{font-size:.75rem; letter-spacing:1.5px; text-transform:uppercase; font-weight:800;}
  .rotulo.p{color:#E25E42;} .rotulo.r{color:#4338ca;}
  .pergunta{font-size:1.4rem; font-weight:800; line-height:1.4;}
  .resposta{font-size:1.2rem; line-height:1.5; color:#312e81; display:none; white-space:pre-line;}
  .resposta.mostrar{display:block;}
  .bts{display:flex; gap:10px; margin-top:18px; justify-content:center; flex-wrap:wrap;}
  button{font-family:inherit; font-size:1rem; font-weight:800; border:none; cursor:pointer; padding:14px 22px; border-radius:14px; transition:filter .15s;}
  button:hover{filter:brightness(1.08);}
  .ver{background:#4338ca; color:#fff;} .prox{background:#E25E42; color:#fff;} .voltar{background:#e2e8f0; color:#1E2B38;}
</style>
</head>
<body>
<a href="index.html" class="btn-voltar-hub" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:7px;background:#E25E42;color:#fff;text-decoration:none;font-weight:800;font-size:1rem;padding:11px 18px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:'Segoe UI',system-ui,Arial,sans-serif;">← Voltar</a>
<div class="box">
  <h1>📝 Simulado: o básico em cartões</h1>
  <div class="sub">Pergunta e resposta na mesma tela: leia, tente lembrar de cabeça e confira na hora.</div>
  <div class="contador" id="contador"></div>
  <div class="cartao">
    <div><div class="rotulo p">Pergunta</div><div class="pergunta" id="pergunta"></div></div>
    <div class="resposta" id="resposta"></div>
  </div>
  <div class="bts">
    <button class="voltar" id="voltar">← Voltar</button>
    <button class="ver" id="ver">👁️ Ver resposta</button>
    <button class="prox" id="prox">Próximo →</button>
  </div>
</div>
<script>
const cartoes = [
  ["O que é biotecnologia?", "Usar seres vivos, ou o DNA deles, para fazer produtos e resolver problemas."],
  ["Dê exemplos da biotecnologia antiga.", "Pão, iogurte, queijo e vinho, feitos por fermentação."],
  ["O que é engenharia genética?", "Mexer direto no DNA: cortar um gene e colocar em outro ser vivo."],
  ["O que é DNA recombinante?", "DNA de uma espécie colocado em outra.\nEx.: bactéria que fabrica insulina humana."],
  ["Por que bactérias fabricam insulina?", "Receberam o gene da insulina humana. A insulina vai para os diabéticos."],
  ["O que é um transgênico (OGM)?", "Ser vivo que recebeu gene de OUTRA espécie.\nEx.: milho que resiste a lagartas."],
  ["Como se reconhece transgênico no mercado?", "Pelo T dentro de um triângulo amarelo no rótulo."],
  ["O que é clonagem?", "Fazer um ser com o DNA idêntico ao de outro."],
  ["Quem foi a ovelha Dolly?", "O primeiro mamífero clonado de uma célula adulta, em 1996."],
  ["Existe clone natural?", "Sim: gêmeos idênticos e mudas de planta feitas de um galho."],
  ["O que são células-tronco?", "Células que podem virar vários tipos de célula.\nVêm do embrião, do cordão umbilical e da medula."],
  ["Para que serve o teste de DNA (PCR)?", "Copiar o DNA milhões de vezes para comparar.\nTeste de paternidade e investigação de crimes."],
  ["O que é terapia gênica?", "Colocar um gene normal no lugar do defeituoso."],
  ["O que é doença genética?", "A que vem de alteração no DNA ou no número de cromossomos."],
  ["Quando a alteração passa para os filhos?", "Só quando está nos gametas: óvulo e espermatozoide."],
  ["Quais são os 3 tipos de doença genética?", "Monogênica (um gene), multifatorial (genes + ambiente) e cromossômica."],
  ["Cite doenças recessivas (aa).", "Albinismo, hemofilia, daltonismo, fibrose cística e fenilcetonúria."],
  ["O que é a síndrome de Down?", "Trissomia do 21: três cromossomos 21.\nA pessoa tem 47 cromossomos."],
  ["Genética, hereditária e congênita?", "Genética: alteração no DNA.\nHereditária: passa de pais para filhos.\nCongênita: já se nasce com ela."],
  ["O que é ser portador?", "Ter o gene (Aa) sem ter a doença recessiva. Pode passar para os filhos."],
  ["Anemia falciforme e traço falciforme?", "SS: anemia, hemácia em forma de foice.\nAS: só o traço, sem a doença."],
  ["Para que serve o teste do pezinho?", "Descobrir doenças no recém-nascido. É obrigatório."],
  ["Como reconhecer um ácido?", "Em água solta H⁺. Sabor azedo.\nEx.: HCl, H₂SO₄, vinagre."],
  ["Como reconhecer uma base?", "Em água solta OH⁻. Escorregadia, sabor que amarra.\nEx.: NaOH, Mg(OH)₂."],
  ["O que forma ácido + base?", "Sal + água. É a neutralização.\nHCl + NaOH → NaCl + H₂O."],
  ["Dê exemplos de sais.", "NaCl (sal de cozinha), CaCO₃ (mármore) e NaHCO₃ (bicarbonato)."],
  ["O que é um óxido?", "Dois elementos, sendo um deles o oxigênio. Ex.: CO₂, CaO."],
  ["Quais óxidos causam chuva ácida?", "SO₂, SO₃ e NO₂."],
  ["Por que o leite de magnésia alivia a azia?", "É uma base: neutraliza o ácido do estômago."],
  ["O que é um indicador químico?", "Substância que muda de cor no ácido e na base."],
  ["Fenolftaleína no ácido e na base?", "Ácido: incolor.\nBase: ROSA."],
  ["Papel de tornassol no ácido e na base?", "Ácido: fica vermelho.\nBase: fica azul."],
  ["E o repolho roxo?", "Ácido: vermelho ou rosa.\nBase: verde ou amarelo."],
  ["Como funciona a escala de pH?", "Menor que 7: ácido.\nIgual a 7: neutro.\nMaior que 7: básico."],
]
let i = 0;
const $ = id => document.getElementById(id);
function mostrar(){
  $("contador").textContent = `Cartão ${i+1} de ${cartoes.length}`;
  $("pergunta").textContent = cartoes[i][0];
  $("resposta").textContent = cartoes[i][1];
  $("resposta").className = "resposta mostrar";   // resposta sempre visivel
  $("ver").style.display = "none";
  $("voltar").disabled = (i === 0); $("voltar").style.opacity = (i === 0) ? .4 : 1;
  $("prox").textContent = (i === cartoes.length-1) ? "🔁 Recomeçar" : "Próximo →";
}
$("ver").onclick = ()=>{ $("resposta").className = "resposta mostrar"; $("ver").style.display = "none"; };
$("prox").onclick = ()=>{ i = (i+1) % cartoes.length; mostrar(); };
$("voltar").onclick = ()=>{ if(i > 0){ i--; mostrar(); } };
mostrar();
</script>
</body>
</html>
