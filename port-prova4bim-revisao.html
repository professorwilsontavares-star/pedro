<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão do Pedro: Português, prova do 4º bimestre</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif; background:linear-gradient(160deg,#f5f0fb,#e4d8f1); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:#1E2B38;}
  .box{width:100%; max-width:520px; text-align:center;}
  h1{font-size:1.3rem; color:#6c3fa3; margin-bottom:4px;}
  .sub{color:#64748b; font-size:.9rem; margin-bottom:18px;}
  .contador{font-weight:700; color:#64748b; margin-bottom:12px;}
  .cartao{background:#fff; border-radius:22px; box-shadow:0 12px 34px rgba(108,63,163,.16); padding:36px 28px; min-height:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;}
  .rotulo{font-size:.75rem; letter-spacing:1.5px; text-transform:uppercase; font-weight:800;}
  .rotulo.p{color:#E25E42;} .rotulo.r{color:#6c3fa3;}
  .pergunta{font-size:1.4rem; font-weight:800; line-height:1.4;}
  .resposta{font-size:1.2rem; line-height:1.5; color:#4a2a75; display:none; white-space:pre-line;}
  .resposta.mostrar{display:block;}
  .bts{display:flex; gap:10px; margin-top:18px; justify-content:center; flex-wrap:wrap;}
  button{font-family:inherit; font-size:1rem; font-weight:800; border:none; cursor:pointer; padding:14px 22px; border-radius:14px; transition:filter .15s;}
  button:hover{filter:brightness(1.08);}
  .ver{background:#6c3fa3; color:#fff;} .prox{background:#E25E42; color:#fff;} .voltar{background:#e2e8f0; color:#1E2B38;}
</style>
</head>
<body>
<a href="index.html" class="btn-voltar-hub" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:7px;background:#E25E42;color:#fff;text-decoration:none;font-weight:800;font-size:1rem;padding:11px 18px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:'Segoe UI',system-ui,Arial,sans-serif;">← Voltar</a>
<div class="box">
  <h1>✍️ Português: o básico em cartões</h1>
  <div class="sub">Pergunta e resposta na mesma tela: leia, tente lembrar de cabeça e confira na hora.</div>
  <div class="contador" id="contador"></div>
  <div class="cartao">
    <div><div class="rotulo p">Pergunta</div><div class="pergunta" id="pergunta"></div></div>
    <div class="resposta" id="resposta"></div>
  </div>
  <div class="bts">
    <button class="voltar" id="voltar">← Voltar</button>
    <button class="ver" id="ver">👁️ Ver resposta</button>
    <button class="prox" id="prox">Próximo →</button>
  </div>
</div>
<script>
const cartoes = [
  ["Quais são os três modos do verbo?", "Indicativo: certeza.\nSubjuntivo: dúvida.\nImperativo: ordem ou pedido."],
  ["\"Talvez chova.\" Qual é o modo?", "SUBJUNTIVO: indica dúvida."],
  ["\"Feche a porta.\" Qual é o modo?", "IMPERATIVO: indica ordem."],
  ["O que indica o pretérito perfeito?", "Ação concluída. Ex.: voou."],
  ["O que indica o pretérito imperfeito?", "Ação em andamento ou hábito. Ex.: voava."],
  ["O que é o pretérito mais-que-perfeito?", "Passado anterior a outro passado. Ex.: voara."],
  ["O que indica o futuro do pretérito?", "Hipótese ou condição. Ex.: voaria."],
  ["Complete: \"Se pudesse, ...\"", "voaria. Os verbos combinam: é a correlação verbal."],
  ["Infinitivo, gerúndio e particípio?", "Infinitivo: cantar.\nGerúndio: cantando.\nParticípio: cantado."],
  ["O que é verbo de ligação?", "Verbo que liga o sujeito a uma característica, sem indicar ação."],
  ["Cite verbos de ligação.", "Ser, estar, ficar, parecer, continuar e permanecer."],
  ["O que é predicativo do sujeito?", "A característica do sujeito. \"O cão está doente\": doente."],
  ["Ser e estar: qual a diferença?", "Ser: estado duradouro.\nEstar: estado temporário."],
  ["\"Ficou em casa\": é verbo de ligação?", "NÃO. Indica lugar."],
  ["O que é discurso direto?", "A fala da personagem, com travessão ou aspas."],
  ["O que é discurso indireto?", "O narrador conta a fala, usando \"que\" ou \"se\"."],
  ["O que é discurso indireto livre?", "Mistura a voz do narrador e a da personagem, sem aviso."],
  ["O que é verbo de elocução?", "O verbo que indica a fala: disse, gritou, perguntou."],
  ["Passe para indireto: Ela disse: — Estou feliz.", "Ela disse que estava feliz."],
  ["Existe \"seje\" ou \"esteje\"?", "NÃO. O certo é seja e esteja."],
  ["Quando eu vir ou quando eu vier?", "\"Quando eu vir\" vem de VER.\n\"Quando eu vier\" vem de VIR."],
  ["Pôde e pode?", "Pôde: passado.\nPode: presente."],
  ["Os quatro porquês?", "Por que: pergunta.\nPor quê: fim de frase.\nPorque: resposta.\nPorquê: substantivo."],
  ["Mau e mal?", "Mau é o contrário de bom.\nMal é o contrário de bem."],
]
let i = 0;
const $ = id => document.getElementById(id);
function mostrar(){
  $("contador").textContent = `Cartão ${i+1} de ${cartoes.length}`;
  $("pergunta").textContent = cartoes[i][0];
  $("resposta").textContent = cartoes[i][1];
  $("resposta").className = "resposta mostrar";   // resposta sempre visivel
  $("ver").style.display = "none";
  $("voltar").disabled = (i === 0); $("voltar").style.opacity = (i === 0) ? .4 : 1;
  $("prox").textContent = (i === cartoes.length-1) ? "🔁 Recomeçar" : "Próximo →";
}
$("ver").onclick = ()=>{ $("resposta").className = "resposta mostrar"; $("ver").style.display = "none"; };
$("prox").onclick = ()=>{ i = (i+1) % cartoes.length; mostrar(); };
$("voltar").onclick = ()=>{ if(i > 0){ i--; mostrar(); } };
mostrar();
</script>
</body>
</html>
