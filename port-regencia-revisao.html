<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão do Pedro: Regência verbal e nominal</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif; background:linear-gradient(160deg,#f3eefb,#e7dcf5); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:#1E2B38;}
  .box{width:100%; max-width:520px; text-align:center;}
  h1{font-size:1.3rem; color:#6c3fa3; margin-bottom:4px;}
  .sub{color:#64748b; font-size:.9rem; margin-bottom:18px;}
  .contador{font-weight:700; color:#64748b; margin-bottom:12px;}
  .cartao{background:#fff; border-radius:22px; box-shadow:0 12px 34px rgba(60,36,101,.16); padding:36px 28px; min-height:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;}
  .rotulo{font-size:.75rem; letter-spacing:1.5px; text-transform:uppercase; font-weight:800;}
  .rotulo.p{color:#E25E42;} .rotulo.r{color:#2e7d4f;}
  .pergunta{font-size:1.4rem; font-weight:800; line-height:1.4;}
  .resposta{font-size:1.2rem; line-height:1.5; color:#3d2465; display:none;}
  .resposta.mostrar{display:block; animation:sobe .2s ease;}
  @keyframes sobe{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
  .bts{display:flex; gap:10px; margin-top:18px; justify-content:center; flex-wrap:wrap;}
  button{font-family:inherit; font-size:1rem; font-weight:800; border:none; cursor:pointer; padding:14px 22px; border-radius:14px; transition:filter .15s;}
  button:hover{filter:brightness(1.08);}
  .ver{background:#6c3fa3; color:#fff;} .prox{background:#E25E42; color:#fff;} .voltar{background:#e2e8f0; color:#1E2B38;}
</style>
</head>
<body>
<a href="index.html" class="btn-voltar-hub" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:7px;background:#E25E42;color:#fff;text-decoration:none;font-weight:800;font-size:1rem;padding:11px 18px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:'Segoe UI',system-ui,Arial,sans-serif;">← Voltar</a>
<div class="box">
  <h1>🔗 Regência em cartões</h1>
  <div class="sub">Leia a pergunta, pense na resposta e depois confira. Pontos principais!</div>
  <div class="contador" id="contador"></div>
  <div class="cartao">
    <div>
      <div class="rotulo p">Pergunta</div>
      <div class="pergunta" id="pergunta"></div>
    </div>
    <div class="resposta" id="resposta"></div>
  </div>
  <div class="bts">
    <button class="voltar" id="voltar">← Voltar</button>
    <button class="ver" id="ver">👁️ Ver resposta</button>
    <button class="prox" id="prox">Próximo →</button>
  </div>
</div>
<script>
const cartoes = [
  ["O que é regência?", "É a relação entre uma palavra e o termo que completa o sentido dela. Quem manda é o regente; quem completa é o regido."],
  ["O que liga o regente ao regido?", "Normalmente uma preposição: a, de, em, com, por, para."],
  ["Qual a diferença entre regência verbal e nominal?", "Verbal: quem manda é o verbo. Nominal: quem manda é um nome (substantivo, adjetivo ou advérbio)."],
  ["O que é verbo intransitivo?", "É o que não precisa de complemento: O bebê dormiu."],
  ["O que é verbo transitivo direto?", "É o que pede complemento sem preposição: comprei um livro."],
  ["O que é verbo transitivo indireto?", "É o que pede complemento com preposição: gosto de pizza."],
  ["O que é verbo transitivo direto e indireto?", "É o que pede os dois complementos: dei um presente ao meu irmão."],
  ["Como descobrir se o verbo é direto ou indireto?", "Pergunte ao verbo. Se a pergunta vem com preposição (de quê? a quem?), é indireto."],
  ["Assistir no sentido de ver pede o quê?", "A preposição a: assisti AO filme, assisti AO jogo."],
  ["Assistir no sentido de ajudar pede o quê?", "Nada: vai direto. O médico assistiu o doente."],
  ["Aspirar no sentido de desejar?", "Pede a: aspiro AO primeiro lugar."],
  ["Aspirar no sentido de sugar?", "Vai direto: aspirei o pó."],
  ["Visar no sentido de ter como objetivo?", "Pede a: o projeto visa AO bem comum."],
  ["Visar no sentido de dar visto, assinar?", "Vai direto: visou o cheque."],
  ["O que quer dizer 'a reclamação procede'?", "Que ela tem fundamento, faz sentido."],
  ["Proceder no sentido de dar início?", "Pede a: procedeu À leitura do texto."],
  ["Qual a regência de obedecer e desobedecer?", "Pedem a: obedeço AO sinal, obedeça ÀS regras."],
  ["Pagar e perdoar: e quando o complemento é coisa?", "Vai direto, sem preposição: paguei a conta, perdoei a dívida."],
  ["Pagar e perdoar: e quando o complemento é pessoa?", "Pede a: paguei AO garçom, perdoei AO amigo."],
  ["Como usar o verbo informar?", "De dois jeitos: informei o preço ao cliente, ou informei o cliente do preço."],
  ["Qual a regência de responder?", "Pede a: respondi AO e-mail, respondi À pergunta."],
  ["Como se usa preferir na norma culta?", "Prefiro isto A aquilo. Sem 'do que' e sem 'mais'."],
  ["Qual a regência de namorar na escrita formal?", "Vai direto, sem com: ela namora o Pedro."],
  ["Qual a regência de simpatizar?", "Pede com: simpatizei COM ele. E não é pronominal: nada de 'me simpatizei'."],
  ["Lembrar e esquecer sem pronome?", "Vão direto: esqueci o caderno, lembrei o combinado."],
  ["Lembrar-se e esquecer-se, com pronome?", "Pedem de: esqueci-me DO caderno, lembrei-me DO combinado."],
  ["Qual a regência de chegar e ir, falando de lugar?", "Pedem a: cheguei AO colégio, fui AO cinema."],
  ["Implicar no sentido de acarretar?", "Vai direto na norma culta: o atraso implica multa."],
  ["O que significa 'custou-me acreditar'?", "Que foi difícil para mim acreditar. Custar aqui é ser difícil."],
  ["Como fica o pronome relativo quando o verbo pede preposição?", "A preposição vem antes: o filme A QUE assisti, o assunto DE QUE preciso."],
  ["O que a regência tem a ver com a crase?", "Tudo: só há crase se a palavra que manda pedir a e a seguinte aceitar o artigo a. Assisti À peça."],
  ["O que é regência nominal?", "É a preposição que um nome exige: respeito A, capaz DE, ansioso POR, perto DE."],
  ["Qual a preposição de: acesso, favorável e horror?", "As três pedem a: acesso À rua, favorável À proposta, horror A filmes de terror."],
  ["Qual a preposição de: capaz, certeza e perto?", "As três pedem de: capaz DE fazer, certeza DE que vem, perto DA escola."],
  ["Qual a preposição de: compatível, satisfeito e simpatia?", "Pedem com: compatível COM o texto, satisfeito COM o resultado, simpatia POR alguém também aparece."],
  ["Dica final para não errar regência", "Pergunte ao verbo ou ao nome: 'preciso de quê?', 'capaz de quê?'. A preposição que aparecer é a regência."],
];
let i = 0;
const $ = id => document.getElementById(id);
function mostrar(){
  $("contador").textContent = `Cartão ${i+1} de ${cartoes.length}`;
  $("pergunta").textContent = cartoes[i][0];
  $("resposta").textContent = cartoes[i][1];
  $("resposta").className = "resposta";
  $("ver").style.display = "inline-block";
  $("voltar").disabled = (i === 0); $("voltar").style.opacity = (i === 0) ? .4 : 1;
  $("prox").textContent = (i === cartoes.length-1) ? "🔁 Recomeçar" : "Próximo →";
}
$("ver").onclick = ()=>{ $("resposta").className = "resposta mostrar"; $("ver").style.display = "none"; };
$("prox").onclick = ()=>{ i = (i+1) % cartoes.length; mostrar(); };
$("voltar").onclick = ()=>{ if(i > 0){ i--; mostrar(); } };
mostrar();
</script>
</body>
</html>
