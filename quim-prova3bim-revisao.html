<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revisão do Pedro: Química, prova do 3º bimestre</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",system-ui,Arial,sans-serif; background:linear-gradient(160deg,#eeedfb,#d9d6f5); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; color:#1E2B38;}
  .box{width:100%; max-width:520px; text-align:center;}
  h1{font-size:1.3rem; color:#4338ca; margin-bottom:4px;}
  .sub{color:#64748b; font-size:.9rem; margin-bottom:18px;}
  .contador{font-weight:700; color:#64748b; margin-bottom:12px;}
  .cartao{background:#fff; border-radius:22px; box-shadow:0 12px 34px rgba(67,56,202,.16); padding:36px 28px; min-height:250px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;}
  .rotulo{font-size:.75rem; letter-spacing:1.5px; text-transform:uppercase; font-weight:800;}
  .rotulo.p{color:#E25E42;} .rotulo.r{color:#4338ca;}
  .pergunta{font-size:1.4rem; font-weight:800; line-height:1.4;}
  .resposta{font-size:1.2rem; line-height:1.5; color:#312e81; display:none; white-space:pre-line;}
  .resposta.mostrar{display:block;}
  .bts{display:flex; gap:10px; margin-top:18px; justify-content:center; flex-wrap:wrap;}
  button{font-family:inherit; font-size:1rem; font-weight:800; border:none; cursor:pointer; padding:14px 22px; border-radius:14px; transition:filter .15s;}
  button:hover{filter:brightness(1.08);}
  .ver{background:#4338ca; color:#fff;} .prox{background:#E25E42; color:#fff;} .voltar{background:#e2e8f0; color:#1E2B38;}
</style>
</head>
<body>
<a href="index.html" class="btn-voltar-hub" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:7px;background:#E25E42;color:#fff;text-decoration:none;font-weight:800;font-size:1rem;padding:11px 18px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:'Segoe UI',system-ui,Arial,sans-serif;">← Voltar</a>
<div class="box">
  <h1>🧪 Química: o básico em cartões</h1>
  <div class="sub">Pergunta e resposta na mesma tela: leia, tente lembrar de cabeça e confira na hora.</div>
  <div class="contador" id="contador"></div>
  <div class="cartao">
    <div><div class="rotulo p">Pergunta</div><div class="pergunta" id="pergunta"></div></div>
    <div class="resposta" id="resposta"></div>
  </div>
  <div class="bts">
    <button class="voltar" id="voltar">← Voltar</button>
    <button class="ver" id="ver">👁️ Ver resposta</button>
    <button class="prox" id="prox">Próximo →</button>
  </div>
</div>
<script>
const cartoes = [
  ["Quantos tipos de ligação química existem?", "TRÊS: iônica, covalente e metálica."],
  ["Qual ligação tem o sal de cozinha (NaCl)?", "IÔNICA."],
  ["Qual ligação tem a água (H₂O)?", "COVALENTE."],
  ["Qual ligação tem um fio de cobre?", "METÁLICA."],
  ["Na ligação covalente, os átomos...", "COMPARTILHAM elétrons."],
  ["Na ligação iônica, os átomos...", "TRANSFEREM elétrons: um entrega, o outro recebe."],
  ["Cátion é positivo ou negativo?", "POSITIVO (+)."],
  ["Ânion é positivo ou negativo?", "NEGATIVO (−)."],
  ["Metal conduz eletricidade?", "SIM. Por isso os fios são de metal."],
  ["HCl é ácido ou base?", "ÁCIDO. Começa com H."],
  ["NaOH é ácido ou base?", "BASE. Termina com OH."],
  ["NaCl é ácido, base ou sal?", "SAL. É o sal de cozinha."],
  ["Limão e vinagre são ácidos ou básicos?", "ÁCIDOS. Têm sabor azedo."],
  ["Sabão é ácido ou básico?", "BÁSICO."],
  ["Qual é o pH neutro?", "7. É o da água pura."],
  ["O que diz a regra do octeto?", "O átomo se liga para ficar com 8 elétrons na última camada (ou 2, se só tiver a camada K), igual a um gás nobre."],
  ["Quem propôs a regra do octeto?", "Gilbert Lewis e Walther Kossel, no início do século XX."],
  ["O que é camada de valência?", "A última camada de elétrons. É ela que faz a ligação."],
  ["Metal perde ou ganha elétron?", "PERDE e vira cátion (+).\nGrupos 1, 2 e 13: cargas 1+, 2+ e 3+."],
  ["Não metal perde ou ganha elétron?", "GANHA e vira ânion (−).\nGrupos 15, 16 e 17: cargas 3−, 2− e 1−."],
  ["Ligação iônica: entre quem e o que acontece?", "Metal + não metal.\nO metal ENTREGA elétrons ao não metal, e os íons se atraem. Ex.: NaCl."],
  ["Como se monta a fórmula iônica?", "Cruza as cargas: a carga de um vira o número pequeno do outro.\nMg²⁺ e Br⁻ → MgBr₂."],
  ["Qual é a fórmula entre Ca²⁺ e Cl⁻? E entre Na⁺ e O²⁻?", "CaCl₂.\nNa₂O."],
  ["Como são os compostos iônicos?", "Sólidos (retículo cristalino).\nQuebradiços.\nFusão e ebulição altas.\nA maioria dissolve em água."],
  ["Composto iônico conduz corrente?", "Sólido: NÃO (íons presos).\nFundido ou dissolvido em água: SIM (íons livres)."],
  ["Ligação covalente: entre quem e o que acontece?", "Não metal + não metal (ou H).\nOs dois COMPARTILHAM pares de elétrons e formam moléculas."],
  ["Ligação simples, dupla e tripla?", "Simples (–): 1 par.\nDupla (=): 2 pares.\nTripla (≡): 3 pares."],
  ["Quantas ligações covalentes faz cada um?", "H e grupo 17: 1.\nGrupo 16 (O, S): 2.\nGrupo 15 (N, P): 3.\nGrupo 14 (C): 4."],
  ["Fórmula molecular, eletrônica e estrutural?", "Molecular: conta os átomos (H₂O).\nEletrônica (Lewis): elétrons em pontinhos.\nEstrutural: pares em tracinhos (H–O–H)."],
  ["Fórmula estrutural do CO₂ e do N₂?", "CO₂: O=C=O.\nN₂: N≡N."],
  ["Ligação metálica: o que é?", "Cátions de metal cercados por um MAR (ou nuvem) DE ELÉTRONS livres."],
  ["Propriedades dos metais?", "Brilho.\nConduzem eletricidade e calor.\nMaleáveis (lâminas) e dúcteis (fios).\nFusão alta (menos o mercúrio, que é líquido)."],
  ["Bronze, latão, aço e ouro 18 quilates?", "Bronze: cobre + estanho.\nLatão: cobre + zinco.\nAço: ferro + carbono.\nOuro 18 k: 75% ouro + cobre e prata."],
  ["Ácido e base, segundo Arrhenius?", "Ácido: em água libera H⁺ (ionização).\nBase: em água libera OH⁻ (dissociação)."],
  ["Onde estão HCl, H₂SO₄, HNO₃ e H₂CO₃?", "HCl: suco gástrico e ácido muriático.\nH₂SO₄: bateria de carro.\nHNO₃: explosivos.\nH₂CO₃: refrigerante."],
  ["Soda cáustica, cal hidratada e leite de magnésia?", "Soda cáustica: NaOH.\nCal hidratada: Ca(OH)₂.\nLeite de magnésia: Mg(OH)₂.\nTodas são bases."],
  ["Fenolftaleína e escala de pH?", "Fenolftaleína: incolor no ácido, ROSA na base.\npH menor que 7: ácido; 7: neutro; maior que 7: básico."],
  ["Ácido + base forma o quê?", "SAL + ÁGUA (neutralização).\nHCl + NaOH → NaCl + H₂O."],
  ["Ácido + carbonato forma o quê?", "Gás carbônico e água: é a efervescência da casca de ovo no vinagre."],
]
let i = 0;
const $ = id => document.getElementById(id);
function mostrar(){
  $("contador").textContent = `Cartão ${i+1} de ${cartoes.length}`;
  $("pergunta").textContent = cartoes[i][0];
  $("resposta").textContent = cartoes[i][1];
  $("resposta").className = "resposta mostrar";   // resposta sempre visivel
  $("ver").style.display = "none";
  $("voltar").disabled = (i === 0); $("voltar").style.opacity = (i === 0) ? .4 : 1;
  $("prox").textContent = (i === cartoes.length-1) ? "🔁 Recomeçar" : "Próximo →";
}
$("ver").onclick = ()=>{ $("resposta").className = "resposta mostrar"; $("ver").style.display = "none"; };
$("prox").onclick = ()=>{ i = (i+1) % cartoes.length; mostrar(); };
$("voltar").onclick = ()=>{ if(i > 0){ i--; mostrar(); } };
mostrar();
</script>
</body>
</html>
