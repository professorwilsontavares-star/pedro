<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz do Pedro: Ligações químicas</title>
<style>
  :root{--navy:#1E2B38; --q:#4338ca; --q-cl:#e8e7fb; --laranja:#FFE4CC; --coral:#E25E42; --ok:#2e7d4f; --ok-cl:#d7f0df; --no:#c0392b; --no-cl:#fbe0dc; --cinza:#64748b;}
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI",system-ui,-apple-system,Arial,sans-serif; background:linear-gradient(160deg,#eeedfb,#d9d6f5); color:var(--navy); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; line-height:1.55;}
  .app{width:100%; max-width:640px; background:#fff; border-radius:24px; box-shadow:0 12px 40px rgba(67,56,202,.16); overflow:hidden;}
  header{background:linear-gradient(135deg,#4338ca,#312e81); color:#fff; padding:22px 26px 18px;}
  header .selo{font-size:.72rem; letter-spacing:1.5px; text-transform:uppercase; opacity:.8; font-weight:700;}
  header h1{font-size:1.35rem; margin-top:4px;}
  .barra-topo{display:flex; justify-content:space-between; align-items:center; margin-top:14px; font-size:.9rem; font-weight:700;}
  .progresso{height:9px; background:rgba(255,255,255,.25); border-radius:20px; margin-top:10px; overflow:hidden;}
  .progresso span{display:block; height:100%; width:0; background:var(--coral); border-radius:20px; transition:width .35s ease;}
  main{padding:26px 26px 30px;}
  .pergunta{font-size:1.25rem; font-weight:800; color:var(--navy); margin-bottom:20px; min-height:60px;}
  .alternativas{display:flex; flex-direction:column; gap:12px;}
  .alt{text-align:left; font-size:1.05rem; padding:15px 18px; border:2px solid #d9d6f5; background:#f7f6fe; border-radius:14px; cursor:pointer; transition:all .15s ease; display:flex; align-items:center; gap:12px; font-family:inherit; color:var(--navy);}
  .alt:hover:not(:disabled){border-color:var(--q); background:var(--q-cl); transform:translateY(-1px);}
  .alt:disabled{cursor:default;}
  .alt .letra{flex:0 0 30px; height:30px; border-radius:50%; background:var(--q); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.95rem;}
  .alt.certo{border-color:var(--ok); background:var(--ok-cl);} .alt.certo .letra{background:var(--ok);}
  .alt.errado{border-color:var(--no); background:var(--no-cl);} .alt.errado .letra{background:var(--no);}
  .feedback{margin-top:20px; padding:15px 18px; border-radius:14px; display:none; font-size:1rem;}
  .feedback.mostrar{display:block;}
  .feedback.ok{background:var(--ok-cl);}
  .feedback.no{background:var(--no-cl);}
  .feedback b:first-child{display:block; margin-bottom:3px;}
  .proxima{margin-top:20px; width:100%; padding:15px; font-size:1.1rem; font-weight:800; background:var(--coral); color:#fff; border:none; border-radius:14px; cursor:pointer; font-family:inherit; display:none;}
  .proxima.mostrar{display:block;} .proxima:hover{filter:brightness(1.08);}
  .final{text-align:center; padding:14px 6px;}
  .final .emoji{font-size:3.4rem;} .final h2{font-size:1.6rem; margin:10px 0;}
  .final .placar{font-size:1.15rem; color:var(--cinza); margin-bottom:6px;}
  .final .nota{font-size:3rem; font-weight:900; color:var(--q); margin:6px 0;}
  .final .recado{background:var(--laranja); border-radius:14px; padding:14px 18px; margin:18px 0; color:var(--navy);}
  .refazer{padding:14px 28px; font-size:1.05rem; font-weight:800; background:var(--q); color:#fff; border:none; border-radius:14px; cursor:pointer; font-family:inherit;}
</style>
</head>
<body>
<a href="index.html" class="btn-voltar-hub" style="position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:9999;display:inline-flex;align-items:center;gap:7px;background:#E25E42;color:#fff;text-decoration:none;font-weight:800;font-size:1rem;padding:11px 18px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:'Segoe UI',system-ui,Arial,sans-serif;">← Voltar</a>
<div class="app">
  <header>
    <div class="selo">Ciências · 9º ano · Setor C · Quiz</div>
    <h1>Ligações químicas 🔗</h1>
    <div class="barra-topo"><span id="contador">Questão 1</span><span id="placar">Acertos: 0</span></div>
    <div class="progresso"><span id="barra"></span></div>
  </header>
  <main id="palco">
    <div class="pergunta" id="pergunta"></div>
    <div class="alternativas" id="alternativas"></div>
    <div class="feedback" id="feedback"></div>
    <button class="proxima" id="proxima">Próxima ➜</button>
  </main>
</div>
<script>
const questoes = [
  // octeto e valencia
  { q:"Por que os gases nobres quase não fazem ligações?", alt:["Porque já têm 8 elétrons na última camada","Porque não têm elétrons","Porque são metais"], c:0,
    e:"Com a última camada completa, eles já são estáveis sozinhos. O hélio é estável com 2." },
  { q:"A regra do octeto diz que os átomos se ligam para ficar com...", alt:["8 elétrons na última camada","8 prótons no núcleo","8 camadas de elétrons"], c:0,
    e:"Ficar com 8 na última camada deixa o átomo estável, igual a um gás nobre." },
  { q:"A camada de valência é...", alt:["a última camada de elétrons","o núcleo do átomo","a primeira camada de elétrons"], c:0,
    e:"Só os elétrons da última camada participam das ligações." },
  { q:"Com quantos elétrons na última camada o hidrogênio fica estável?", alt:["2","8","1"], c:0,
    e:"Ele imita o hélio, que é estável com 2 elétrons." },
  { q:"Um átomo com 1, 2 ou 3 elétrons na última camada tende a...", alt:["perder elétrons","ganhar elétrons","não fazer ligação"], c:0,
    e:"É mais fácil perder poucos do que ganhar muitos. Esse é o comportamento dos metais." },
  { q:"Um átomo com 5, 6 ou 7 elétrons na última camada tende a...", alt:["ganhar elétrons","perder elétrons","virar gás nobre sozinho"], c:0,
    e:"Faltam poucos para chegar a 8. Esse é o comportamento dos ametais." },
  { q:"Os metais, nas ligações, tendem a...", alt:["perder elétrons e virar cátions","ganhar elétrons e virar ânions","compartilhar sempre"], c:0,
    e:"Metal perde elétron e fica com carga positiva." },
  { q:"Os ametais, na ligação com metais, tendem a...", alt:["ganhar elétrons e virar ânions","perder elétrons e virar cátions","não reagir"], c:0,
    e:"Ametal ganha elétron e fica com carga negativa." },
  { q:"Um cátion é um íon...", alt:["positivo, que perdeu elétrons","negativo, que ganhou elétrons","sem carga"], c:0,
    e:"Perdeu elétron (que é negativo), então sobra carga positiva. Ex.: Na⁺." },
  { q:"Um ânion é um íon...", alt:["negativo, que ganhou elétrons","positivo, que perdeu elétrons","sem carga"], c:0,
    e:"Ganhou elétron, então fica com carga negativa. Ex.: Cl⁻." },
  { q:"O magnésio (família 2) forma o íon...", alt:["Mg²⁺","Mg²⁻","Mg⁺"], c:0,
    e:"Tem 2 elétrons na última camada e perde os 2." },
  { q:"O alumínio (família 13) forma o íon...", alt:["Al³⁺","Al³⁻","Al⁺"], c:0,
    e:"Tem 3 elétrons na última camada e perde os 3." },
  { q:"O oxigênio (família 16) forma o íon...", alt:["O²⁻","O²⁺","O⁶⁻"], c:0,
    e:"Tem 6 elétrons na última camada e ganha 2 para chegar a 8." },
  { q:"O cloro (família 17) forma o íon...", alt:["Cl⁻","Cl⁺","Cl⁷⁺"], c:0,
    e:"Tem 7 elétrons na última camada e ganha 1." },
  { q:"O sódio (família 1) forma o íon...", alt:["Na⁺","Na⁻","Na²⁺"], c:0,
    e:"Tem 1 elétron na última camada e perde esse 1." },
  // ionica
  { q:"A ligação iônica acontece entre...", alt:["metal e ametal","ametal e ametal","metal e metal"], c:0,
    e:"O metal entrega elétrons e o ametal recebe." },
  { q:"Na ligação iônica, os elétrons são...", alt:["transferidos de um átomo para o outro","compartilhados entre os dois","espalhados num mar de elétrons"], c:0,
    e:"Transferência é a palavra-chave da ligação iônica." },
  { q:"O que mantém o Na⁺ e o Cl⁻ unidos no sal de cozinha?", alt:["A atração entre cargas opostas","Um par de elétrons compartilhado","O mar de elétrons"], c:0,
    e:"Positivo e negativo se atraem: é a ligação iônica." },
  { q:"Na formação do NaCl, o sódio...", alt:["entrega 1 elétron ao cloro","recebe 1 elétron do cloro","divide 1 elétron com o cloro"], c:0,
    e:"O sódio vira Na⁺ e o cloro vira Cl⁻." },
  { q:"Qual é a fórmula do composto formado por Al³⁺ e O²⁻?", alt:["Al₂O₃","Al₃O₂","AlO"], c:0,
    e:"Cruzando as cargas: o 3 do alumínio vai para o oxigênio e o 2 do oxigênio vai para o alumínio." },
  { q:"Qual é a fórmula do composto formado por Ca²⁺ e Cl⁻?", alt:["CaCl₂","Ca₂Cl","CaCl"], c:0,
    e:"Precisa de dois Cl⁻ para equilibrar o Ca²⁺: +2 −2 = 0." },
  { q:"Qual é a fórmula do composto formado por Mg²⁺ e O²⁻?", alt:["MgO","Mg₂O₂","MgO₂"], c:0,
    e:"O cruzamento dá Mg₂O₂, que se simplifica dividindo por 2." },
  { q:"Qual é a fórmula do composto formado por Na⁺ e S²⁻?", alt:["Na₂S","NaS₂","NaS"], c:0,
    e:"São precisos dois Na⁺ para equilibrar o S²⁻." },
  { q:"Qual é a fórmula do composto formado por Al³⁺ e Cl⁻?", alt:["AlCl₃","Al₃Cl","AlCl"], c:0,
    e:"Três Cl⁻ equilibram um Al³⁺: +3 −3 = 0." },
  { q:"Numa fórmula iônica correta, a soma das cargas é...", alt:["zero","sempre positiva","sempre negativa"], c:0,
    e:"O composto é neutro: as cargas positivas e negativas se cancelam." },
  { q:"Na fórmula de um composto iônico, quem vem primeiro?", alt:["O cátion (o metal)","O ânion (o ametal)","Tanto faz"], c:0,
    e:"Por isso se escreve NaCl e CaCl₂." },
  { q:"Os compostos iônicos, na temperatura ambiente, são...", alt:["sólidos","gasosos","sempre líquidos"], c:0,
    e:"Os íons ficam organizados num retículo cristalino." },
  { q:"O ponto de fusão dos compostos iônicos é...", alt:["alto","baixo","sempre abaixo de 0 °C"], c:0,
    e:"O sal de cozinha só derrete a 801 °C." },
  { q:"O sal de cozinha SÓLIDO conduz corrente elétrica?", alt:["Não, os íons estão presos","Sim, sempre","Sim, porque tem elétrons livres"], c:0,
    e:"No sólido, os íons não se movem. Sem carga em movimento, não há corrente." },
  { q:"O sal de cozinha DISSOLVIDO NA ÁGUA conduz corrente elétrica?", alt:["Sim, os íons ficam livres","Não, nunca","Só se a água for do mar"], c:0,
    e:"Na água, Na⁺ e Cl⁻ se soltam e carregam a corrente." },
  { q:"O retículo cristalino é...", alt:["o arranjo organizado de cátions e ânions do composto iônico","uma molécula de água","o mar de elétrons dos metais"], c:0,
    e:"É por isso que os grãos de sal têm forma de cubinho." },
  { q:"Os compostos iônicos costumam ser...", alt:["duros, mas quebradiços","moles e flexíveis","maleáveis como os metais"], c:0,
    e:"Uma batida forte desalinha os íons e o cristal se parte." },
  // covalente
  { q:"A ligação covalente acontece entre...", alt:["ametal e ametal, ou ametal e hidrogênio","metal e ametal","metal e metal"], c:0,
    e:"Todos querem ganhar elétrons, então compartilham." },
  { q:"Na ligação covalente, os elétrons são...", alt:["compartilhados","transferidos","perdidos para o ambiente"], c:0,
    e:"Compartilhamento é a palavra-chave da ligação covalente." },
  { q:"Por que na ligação covalente os átomos compartilham em vez de transferir?", alt:["Porque os dois querem ganhar elétrons","Porque os dois querem perder elétrons","Porque são gases nobres"], c:0,
    e:"Ninguém aceita entregar, então os dois dividem pares de elétrons." },
  { q:"A ligação covalente também é chamada de...", alt:["molecular","iônica","metálica"], c:0,
    e:"O conjunto de átomos unidos por ligação covalente forma uma molécula." },
  { q:"Na ligação covalente, formam-se íons?", alt:["Não","Sim, sempre","Só cátions"], c:0,
    e:"Como ninguém entrega elétron, ninguém fica com carga." },
  { q:"Uma ligação dupla compartilha quantos pares de elétrons?", alt:["2 pares","1 par","3 pares"], c:0,
    e:"Simples = 1 par, dupla = 2 pares, tripla = 3 pares." },
  { q:"Uma ligação tripla compartilha quantos pares de elétrons?", alt:["3 pares","2 pares","6 pares"], c:0,
    e:"É o caso do N₂: N≡N." },
  { q:"Na molécula de O₂, a ligação é...", alt:["dupla","simples","tripla"], c:0,
    e:"Cada oxigênio precisa de 2 elétrons, então dividem 2 pares: O=O." },
  { q:"Na molécula de N₂, a ligação é...", alt:["tripla","dupla","simples"], c:0,
    e:"Cada nitrogênio precisa de 3 elétrons: N≡N." },
  { q:"Na molécula de H₂, a ligação é...", alt:["simples","dupla","iônica"], c:0,
    e:"Cada hidrogênio precisa de só 1 elétron: H–H." },
  { q:"Quantas ligações covalentes o carbono costuma fazer?", alt:["4","2","1"], c:0,
    e:"Tem 4 elétrons na última camada e precisa de mais 4. Ex.: CH₄." },
  { q:"Quantas ligações covalentes o oxigênio costuma fazer?", alt:["2","4","1"], c:0,
    e:"Tem 6 e precisa de mais 2. Ex.: H–O–H." },
  { q:"Quantas ligações covalentes o nitrogênio costuma fazer?", alt:["3","1","4"], c:0,
    e:"Tem 5 e precisa de mais 3. Ex.: NH₃." },
  { q:"Qual é a fórmula estrutural da água?", alt:["H–O–H","H=O=H","O–H–O"], c:0,
    e:"O oxigênio faz 2 ligações simples, uma com cada hidrogênio." },
  { q:"Qual é a fórmula estrutural do gás carbônico (CO₂)?", alt:["O=C=O","O–C–O","C=O=O"], c:0,
    e:"O carbono faz 4 ligações: duas duplas, uma com cada oxigênio." },
  { q:"A fórmula que mostra as ligações em tracinhos é a...", alt:["estrutural","molecular","iônica"], c:0,
    e:"A molecular só conta os átomos; a eletrônica mostra os elétrons em pontinhos." },
  { q:"A fórmula H₂O, que só conta os átomos, é a...", alt:["molecular","estrutural","eletrônica"], c:0,
    e:"Diz que há 2 hidrogênios e 1 oxigênio, sem mostrar as ligações." },
  { q:"As substâncias moleculares, comparadas às iônicas, têm ponto de fusão...", alt:["mais baixo","mais alto","igual"], c:0,
    e:"Por isso muitas são líquidas ou gasosas na temperatura ambiente." },
  { q:"A água pura e o açúcar dissolvido na água conduzem corrente elétrica?", alt:["Não, porque não há íons livres","Sim, muito bem","Só o açúcar conduz"], c:0,
    e:"São substâncias moleculares: não formam íons na água." },
  // metalica
  { q:"A ligação metálica acontece entre...", alt:["metal e metal","metal e ametal","ametal e hidrogênio"], c:0,
    e:"Dentro de um pedaço de ferro, cobre ou ouro, por exemplo." },
  { q:"Na ligação metálica, os elétrons ficam...", alt:["livres, formando um mar de elétrons","presos entre dois átomos","transferidos para um ametal"], c:0,
    e:"Os cátions do metal ficam mergulhados nesse mar de elétrons." },
  { q:"Por que os metais conduzem bem a eletricidade?", alt:["Por causa dos elétrons livres","Porque têm íons presos","Porque compartilham pares de elétrons"], c:0,
    e:"Os elétrons livres se movem com facilidade e carregam a corrente." },
  { q:"Poder virar fio (como o fio de cobre) é a propriedade chamada...", alt:["ductilidade","maleabilidade","brilho"], c:0,
    e:"Dúctil = vira fio. Maleável = vira lâmina." },
  { q:"Poder virar lâmina (como o papel-alumínio) é a propriedade chamada...", alt:["maleabilidade","ductilidade","condutividade"], c:0,
    e:"Maleável = vira lâmina. Dúctil = vira fio." },
  { q:"Qual metal é líquido na temperatura ambiente?", alt:["Mercúrio","Ferro","Alumínio"], c:0,
    e:"É a exceção: os outros metais são sólidos." },
  { q:"O bronze é uma liga de...", alt:["cobre e estanho","cobre e zinco","ferro e carbono"], c:0,
    e:"Usado em medalhas, estátuas e sinos." },
  { q:"O latão é uma liga de...", alt:["cobre e zinco","cobre e estanho","ferro e cromo"], c:0,
    e:"Usado em chaves, torneiras e instrumentos de sopro." },
  { q:"O aço é uma liga de...", alt:["ferro e carbono","cobre e estanho","ouro e prata"], c:0,
    e:"Com cromo e níquel a mais, vira aço inox, que não enferruja." },
  { q:"O ouro 18 quilates tem quanto de ouro?", alt:["75%","100%","18%"], c:0,
    e:"São 18 partes de ouro em 24. O ouro puro (24 quilates) é mole demais para joia." },
  // identificar
  { q:"No NaCl, a ligação é...", alt:["iônica","covalente","metálica"], c:0,
    e:"Sódio é metal e cloro é ametal." },
  { q:"No KBr, a ligação é...", alt:["iônica","covalente","metálica"], c:0,
    e:"Potássio é metal e bromo é ametal." },
  { q:"Na H₂O, a ligação é...", alt:["covalente","iônica","metálica"], c:0,
    e:"Oxigênio é ametal e o hidrogênio compartilha elétrons." },
  { q:"No HCl, a ligação é...", alt:["covalente","iônica","metálica"], c:0,
    e:"Hidrogênio com ametal: compartilhamento." },
  { q:"No CO₂, a ligação é...", alt:["covalente","iônica","metálica"], c:0,
    e:"Carbono e oxigênio são ametais." },
  { q:"Num fio de cobre, a ligação é...", alt:["metálica","iônica","covalente"], c:0,
    e:"Metal puro: cátions de cobre no mar de elétrons." },
  { q:"O hidrogênio, ligado a ametais, faz ligação...", alt:["covalente","iônica","metálica"], c:0,
    e:"Ele está na coluna 1, mas não é metal." },
]
function embaralhar(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function preparar(){ return embaralhar(questoes.slice()).map(q=>{ const alts=q.alt.map((t,i)=>({t,c:i===q.c})); embaralhar(alts); return {q:q.q, alt:alts.map(a=>a.t), c:alts.findIndex(a=>a.c), e:q.e}; }); }
let jogo = preparar(); let atual=0, acertos=0; const letras=["A","B","C"]; const $=id=>document.getElementById(id);
function render(){ const it=jogo[atual]; $("contador").textContent=`Questão ${atual+1} de ${jogo.length}`; $("placar").textContent=`Acertos: ${acertos}`; $("barra").style.width=`${(atual/jogo.length)*100}%`; $("pergunta").textContent=it.q; const b=$("alternativas"); b.innerHTML=""; it.alt.forEach((t,i)=>{ const x=document.createElement("button"); x.className="alt"; x.innerHTML=`<span class="letra">${letras[i]}</span><span>${t}</span>`; x.onclick=()=>responder(i); b.appendChild(x); }); const f=$("feedback"); f.className="feedback"; f.innerHTML=""; $("proxima").className="proxima"; $("proxima").textContent=atual===jogo.length-1?"Ver resultado 🏁":"Próxima ➜"; }
function responder(e){ const it=jogo[atual]; document.querySelectorAll(".alt").forEach((b,i)=>{ b.disabled=true; if(i===it.c)b.classList.add("certo"); if(i===e&&e!==it.c)b.classList.add("errado"); }); const f=$("feedback"); if(e===it.c){acertos++; f.className="feedback ok mostrar"; f.innerHTML=`<b>✅ Acertou!</b>${it.e}`;} else {f.className="feedback no mostrar"; f.innerHTML=`<b>❌ Quase!</b> A resposta certa é <b>${letras[it.c]}</b>. ${it.e}`;} $("placar").textContent=`Acertos: ${acertos}`; $("proxima").classList.add("mostrar"); }
$("proxima").onclick=()=>{ atual++; if(atual<jogo.length)render(); else final(); };
function final(){ const t=jogo.length; const nota=Math.round((acertos/t)*100)/10; const p=acertos/t; let e,m; if(p>=0.9){e="🏆";m="Fera! Mandou muito bem. Pronto para a prova!";} else if(p>=0.7){e="😃";m="Muito bom! Só falta revisar alguns pontinhos.";} else if(p>=0.45){e="🙂";m="Bom começo! Dá uma relida no resumo e refaça.";} else {e="💪";m="Sem problema! Leia o resumo com calma e tente de novo.";} $("barra").style.width="100%"; $("contador").textContent="Fim do quiz"; $("palco").innerHTML=`<div class="final"><div class="emoji">${e}</div><h2>Quiz concluído!</h2><div class="placar">Você acertou <b>${acertos}</b> de <b>${t}</b></div><div class="nota">Nota ${nota}</div><div class="recado">${m}</div><button class="refazer" onclick="reiniciar()">🔀 Embaralhar e refazer</button></div>`; }
function reiniciar(){ atual=0; acertos=0; jogo=preparar(); $("palco").innerHTML=`<div class="pergunta" id="pergunta"></div><div class="alternativas" id="alternativas"></div><div class="feedback" id="feedback"></div><button class="proxima" id="proxima">Próxima ➜</button>`; $("proxima").onclick=()=>{ atual++; if(atual<jogo.length)render(); else final(); }; render(); }
render();
</script>
</body>
</html>
